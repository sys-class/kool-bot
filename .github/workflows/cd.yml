name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # checkov:skip=CKV_GHA_7:input влияет только на выбор уже собранного образа для отката, dispatch никогда не пересобирает (см. job build-and-push)
      image_tag:
        description: 'Existing image tag/sha to (re)deploy. Dispatch never rebuilds — это откат/повторная раскатка уже собранного образа.'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  wait-for-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push'
    steps:
      - name: wait for lint
        uses: lewagon/wait-on-check-action@ccfb013c15c8afb7bf2b7c028fb74dc5a068cccc # v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'lint'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: wait for tests
        uses: lewagon/wait-on-check-action@ccfb013c15c8afb7bf2b7c028fb74dc5a068cccc # v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: 'test (3.13)'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

  build-and-push:
    needs: wait-for-ci
    # собираем только на push. workflow_dispatch не пересобирает из main, а
    # лишь повторно раскатывает уже существующий образ (см. #3 — иначе «откат»
    # тегом перекатывал бы тег свежей сборкой из main и ничего не откатывал)
    if: github.event_name == 'push' && needs.wait-for-ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sys-class/kool-bot:latest
            ghcr.io/sys-class/kool-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: pin deploy ref to immutable digest
        id: ref
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image_ref=ghcr.io/sys-class/kool-bot@${DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    # на push ждём сборку; на dispatch build-and-push пропущен и катим сразу
    if: always() && (github.event_name == 'workflow_dispatch' || needs.build-and-push.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: resolve image ref
        id: target
        env:
          BUILT_REF: ${{ needs.build-and-push.outputs.image_ref }}
          INPUT_TAG: ${{ inputs.image_tag }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "image_ref=ghcr.io/sys-class/kool-bot:${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "image_ref=${BUILT_REF}" >> "$GITHUB_OUTPUT"
          fi

      - name: deploy via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          IMAGE_REF: ${{ steps.target.outputs.image_ref }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: IMAGE_REF
          script: |
            set -e
            cd /opt/kool-bot

            # запоминаем id (sha) текущего образа, а не тег :latest — после
            # ретега :latest уедет на новый образ, а старый останется dangling
            # и идентифицируется только по id
            PREVIOUS_IMAGE_ID=$(docker inspect kool-bot --format='{{.Image}}' 2>/dev/null || echo "")

            # тянем ровно тот образ, что собрал CD (по digest на push, по тегу
            # на dispatch), и перевешиваем на него локальный тег :latest. так на
            # хост попадает именно проверенный образ, а не подвижный :latest из
            # реестра, который мог быть перезаписан между сборкой и деплоем (#2)
            docker pull "$IMAGE_REF"
            docker tag "$IMAGE_REF" ghcr.io/sys-class/kool-bot:latest
            docker compose up -d --force-recreate

            # healthcheck по состоянию контейнера, а не по грепу логов на строку
            # готовности (её мог напечатать любой образ — см. #4). образ теперь
            # отдаёт HEALTHCHECK по живому heartbeat процесса бота
            wait_healthy() {
              for _ in $(seq 1 30); do
                status=$(docker inspect kool-bot --format='{{.State.Health.Status}}' 2>/dev/null || echo "")
                case "$status" in
                  healthy) return 0 ;;
                  unhealthy) return 1 ;;
                esac
                sleep 2
              done
              return 1
            }

            if wait_healthy; then
              echo "healthcheck passed"
              docker image prune -f
              exit 0
            fi

            echo "healthcheck failed"
            if [ -z "$PREVIOUS_IMAGE_ID" ]; then
              echo "no previous image to roll back to"
              exit 1
            fi

            echo "rolling back to $PREVIOUS_IMAGE_ID"
            docker tag "$PREVIOUS_IMAGE_ID" ghcr.io/sys-class/kool-bot:latest
            docker compose up -d --force-recreate

            if wait_healthy; then
              echo "rollback succeeded"
            else
              echo "rollback also failed — manual intervention needed"
            fi
            exit 1

      - name: notify success
        if: success()
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: "Success"
          title: "Deploy succeeded"
          description: "`${{ steps.target.outputs.image_ref }}` is live"

      - name: notify failure
        if: failure()
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: "Failure"
          title: "Deploy failed"
          description: "Rolled back to previous version. Check logs."
