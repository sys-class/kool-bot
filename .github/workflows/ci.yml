name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: setup python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: install deps
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          pip install -r requirements.txt
          pip install ruff

      - name: cache lint
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .ruff_cache
          key: lint-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-

      - name: ruff check
        run: ruff check .

      - name: ruff format
        if: always()
        run: ruff format --check .

      # mypy выпилен: давал 32 ошибки в 10 файлах (в основном implicit Optional
      # в slash-командах и union-attr на discord.py каналах). Запускать с `|| true`
      # бессмысленно — CI всегда зелёный и баги не ловит. Чтобы реально включить,
      # надо: пройтись по cogs/, заменить `member: discord.Member = None` на
      # `Member | None = None`, типизировать кастомные атрибуты CoolBot
      # (webhook_service, command_cooldown), и расставить isinstance-guard'ы
      # или assert'ы для channel.send() где канал может быть None/ForumChannel.

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: setup python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: install deps
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: tests
        run: pytest tests/ -v --cov=. --cov-report=xml --cov-report=term

      - name: upload coverage
        if: matrix.python-version == '3.13' && success()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # собираем образ без пуша в GHCR: ловим поломку базового образа,
      # --require-hashes и cp314-колёс ещё на PR, а не после мержа в CD
      - name: build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: kool-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
