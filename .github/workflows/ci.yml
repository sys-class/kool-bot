name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: install deps
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          pip install -r requirements.txt
          pip install ruff==0.17.3

      - name: cache lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ruff_cache
          key: lint-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-${{ github.sha }}
          restore-keys: |
            lint-${{ runner.os }}-${{ hashFiles('requirements.txt') }}-

      - name: ruff check
        run: ruff check .

      - name: ruff format
        if: always()
        run: ruff format --check .

      # mypy выпилен: давал 32 ошибки в 10 файлах (в основном implicit Optional
      # в slash-командах и union-attr на discord.py каналах). Запускать с `|| true`
      # бессмысленно — CI всегда зелёный и баги не ловит. Чтобы реально включить,
      # надо: пройтись по cogs/, заменить `member: discord.Member = None` на
      # `Member | None = None`, типизировать кастомные атрибуты CoolBot
      # (webhook_service, command_cooldown), и расставить isinstance-guard'ы
      # или assert'ы для channel.send() где канал может быть None/ForumChannel.

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: install deps
        run: |
          python -m pip install --upgrade pip --disable-pip-version-check
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: tests
        run: pytest tests/ -v --cov=. --cov-report=xml --cov-report=term

      - name: upload coverage
        if: matrix.python-version == '3.13' && success()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # собираем образ без пуша в GHCR: ловим поломку базового образа,
      # --require-hashes и cp314-колёс ещё на PR, а не после мержа в CD
      - name: build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: kool-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
