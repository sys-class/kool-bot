name: security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  # TODO: gitleaks-action требует GITLEAKS_LICENSE для GitHub-организаций и без
  # него падает на проверке лицензии, не успев просканировать. Временно отключено
  # до получения лицензионного ключа. Секрет-сканирование пока покрывает trivy fs
  # ниже (scanners включают secret).
  # secrets:
  #   name: secret scan
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 10
  #   steps:
  #     - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
  #       with:
  #         fetch-depth: 0
  #     - name: gitleaks
  #       uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
  #       env:
  #         GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  deps-and-fs:
    name: dependency / filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: trivy filesystem scan
        uses: aquasecurity/trivy-action@bfa4b33a029b9aa80ddb784b45574c30e072c59e # master
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: "true"

  image:
    name: image scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: build image
        run: docker build -t kool-bot:scan .
      - name: trivy image scan
        uses: aquasecurity/trivy-action@bfa4b33a029b9aa80ddb784b45574c30e072c59e # master
        with:
          scan-type: image
          image-ref: kool-bot:scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: "true"
